[build-system]
requires = ["setuptools>=84.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vhc-simplifier"
dynamic = ["version"]
description = "Veeam Health Check Simplifier — processes VBR Health Check exports into remediation artifacts"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "CGFixIT" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Systems Administration",
]

dependencies = [
    "pandas>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/cgfixit/Veeam-HealthCheck-Simplifier"
Issues = "https://github.com/cgfixit/Veeam-HealthCheck-Simplifier/issues"
Releases = "https://github.com/cgfixit/Veeam-HealthCheck-Simplifier/releases"

[project.optional-dependencies]
salesforce = [
    "simple-salesforce>=1.12.10",
    "requests>=2.33.0",
    "urllib3>=2.8.0",
    "idna>=3.15",
    "certifi>=2026.10.18",
    "cryptography>=49.0.0",
    "pyjwt>=2.15.0",
    "zeep>=4.3.3",
    "lxml>=6.1.0",
]
slack = [
    "httpx>=0.28.1",
    "h11>=0.16.0",
    "anyio>=4.14.2",
    "idna>=3.15",
    "certifi>=2026.10.18",
]
integrations = [
    "vhc-simplifier[salesforce,slack]",
]
# Scheduler used only by docker_entrypoint.py; the CLI never imports it.
container = [
    "cronsim>=2.7",
]
dev = [
    "vhc-simplifier[container]",
    "pytest>=9.0.3",
    "pytest-cov>=5.0.0",
    "ruff>=0.15.0",
]

[project.scripts]
vhc-simplifier = "vhc_simplifier:main"

# Release tooling (PEP 735): not package metadata, pinned through constraints.txt.
[dependency-groups]
release = [
    "build>=1.2.2",
    "setuptools>=84.1.0",
    "pyinstaller>=6.22.0",
]

[tool.setuptools]
py-modules = ["vhc_simplifier"]

[tool.setuptools.dynamic]
version = { attr = "vhc_simplifier.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "UP"]
ignore = [
    "UP017",  # datetime.UTC alias — keep timezone.utc for 3.12 compat clarity
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S106"]  # assert and test credentials are fine in tests

[tool.coverage.run]
source = ["vhc_simplifier"]

[tool.coverage.report]
fail_under = 80
show_missing = true
